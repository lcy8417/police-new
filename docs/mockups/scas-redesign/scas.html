<div class="rp-page">
  <nav class="rp-list" id="rp-list" aria-label="SCAS 화면 목록">

      <span class="emblem"><svg viewBox="0 0 24 24" fill="none" stroke="#7fb6ff" stroke-width="1.8"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5l8-3z"/><path d="M8.5 12.5l2.4 2.3 4.6-5" stroke="#4a9eff"/></svg></span>

      <h1>SCAS 재현 비교</h1>
